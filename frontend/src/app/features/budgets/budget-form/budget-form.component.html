<div class="form-page">
  <div class="form-card card">
    <h1 class="form-title">{{ isEditing ? 'Edit Budget' : 'New Budget' }}</h1>

    <div *ngIf="errorMessage" class="error-banner">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="budgetForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          placeholder="e.g. Monthly groceries"
          [class.input-error]="budgetForm.get('name')?.invalid && budgetForm.get('name')?.touched"
        />
        <div class="form-error"
             *ngIf="budgetForm.get('name')?.invalid && budgetForm.get('name')?.touched">
          Budget name is required.
        </div>
      </div>

      <div class="form-group">
        <label for="limitAmount">Limit Amount</label>
        <input
          type="number"
          id="limitAmount"
          formControlName="limitAmount"
          placeholder="0.00"
          min="1"
          step="0.01"
          [class.input-error]="budgetForm.get('limitAmount')?.invalid && budgetForm.get('limitAmount')?.touched"
        />
        <div class="form-error"
             *ngIf="budgetForm.get('limitAmount')?.hasError('required') && budgetForm.get('limitAmount')?.touched">
          Limit amount is required.
        </div>
        <div class="form-error"
             *ngIf="budgetForm.get('limitAmount')?.hasError('min') && budgetForm.get('limitAmount')?.touched">
          Limit amount must be at least 1.
        </div>
      </div>

      <div class="form-group">
        <label for="categoryId">Category</label>
        <select
          id="categoryId"
          formControlName="categoryId"
          [class.input-error]="budgetForm.get('categoryId')?.invalid && budgetForm.get('categoryId')?.touched"
        >
          <option [ngValue]="null" disabled>Select a category</option>
          <option *ngFor="let cat of expenseCategories" [ngValue]="cat.id">{{ cat.name }}</option>
        </select>
        <div class="form-error"
             *ngIf="budgetForm.get('categoryId')?.invalid && budgetForm.get('categoryId')?.touched">
          Category is required.
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="month">Month</label>
          <select id="month" formControlName="month">
            <option *ngFor="let m of months" [ngValue]="m.value">{{ m.label }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="year">Year</label>
          <select id="year" formControlName="year">
            <option *ngFor="let y of years" [ngValue]="y">{{ y }}</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="isLoading">
          <span *ngIf="!isLoading">{{ isEditing ? 'Update' : 'Create' }}</span>
          <span *ngIf="isLoading" class="btn-loading">
            <svg class="spinner-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5">
              <circle class="spinner-circle" cx="12" cy="12" r="10"
                      stroke-dasharray="50" stroke-dashoffset="35" stroke-linecap="round"/>
            </svg>
            Saving...
          </span>
        </button>
        <a routerLink="/budgets" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
