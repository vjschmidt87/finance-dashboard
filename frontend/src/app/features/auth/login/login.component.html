<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="40" height="40">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95.49-7.4-2.04-8.54-5.43h2.18c.92 2.01 2.77 3.5 5.02 3.93l-.02.07c-.21.47-.42.95-.64 1.43zm-.35-3.93H7.5c-.17-.63-.26-1.3-.26-2s.09-1.37.26-2h5.15c.17.63.26 1.3.26 2s-.09 1.37-.26 2zm.85-6H7.5c.56-1.82 1.94-3.27 3.7-3.82l.3-.68V4.07c2.31.29 4.31 1.63 5.42 3.57l-1.58.73c-.57-.86-1.36-1.55-2.28-1.97l-.01.04c-.17.41-.35.83-.54 1.26zm4.26 6h-2.18c.17-.63.26-1.3.26-2s-.09-1.37-.26-2h2.18c.17.63.26 1.3.26 2s-.09 1.37-.26 2z"/>
        </svg>
      </div>
      <h1 class="auth-title">Finance Dashboard</h1>
      <p class="auth-subtitle">Sign in to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <div class="form-group" *ngIf="errorMessage">
        <div class="error-banner">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd"/>
          </svg>
          <span>{{ errorMessage }}</span>
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input
          id="email"
          type="email"
          class="form-input"
          formControlName="email"
          placeholder="you@example.com"
          [class.input-error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
          autocomplete="email"
        />
        <div class="field-errors" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          <span class="field-error" *ngIf="loginForm.get('email')?.hasError('required')">
            Email is required.
          </span>
          <span class="field-error" *ngIf="loginForm.get('email')?.hasError('email')">
            Please enter a valid email address.
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          type="password"
          class="form-input"
          formControlName="password"
          placeholder="Enter your password"
          [class.input-error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          autocomplete="current-password"
        />
        <div class="field-errors" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          <span class="field-error" *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required.
          </span>
          <span class="field-error" *ngIf="loginForm.get('password')?.hasError('minlength')">
            Password must be at least 6 characters.
          </span>
        </div>
      </div>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Sign in</span>
        <span *ngIf="isLoading" class="btn-loading">
          <svg class="spinner" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle class="spinner-circle" cx="12" cy="12" r="10" fill="none" stroke-width="3"/>
          </svg>
          Signing in...
        </span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register" class="auth-link">Create one</a></p>
    </div>
  </div>
</div>
